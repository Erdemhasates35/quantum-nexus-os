name: Quantum Nexus Industrial Core Pipeline

on:
  push:
    branches: [main, master]
    tags: ['v*.*.*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quantum-industrial-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository_quality:
    name: Enterprise repository quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install Python dependencies when declared
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Install Node dependencies when declared
        run: |
          if [ -f package.json ]; then
            if [ -f package-lock.json ]; then npm ci; else npm install; fi
          fi

      - name: Python syntax gate
        run: |
          python - <<'PY'
          import pathlib, py_compile
          failures=[]
          files=[p for p in pathlib.Path('.').rglob('*.py') if '.git' not in p.parts and 'node_modules' not in p.parts]
          for p in files:
              try: py_compile.compile(str(p), doraise=True)
              except Exception as exc: failures.append((str(p), str(exc)))
          if failures:
              for path, error in failures: print(f"PY_COMPILE_FAIL {path}: {error}")
              raise SystemExit(1)
          print(f"Python syntax OK: {len(files)} files")
          PY

      - name: Node build gate
        if: hashFiles('package.json') != ''
        run: npm run build

      - name: Git whitespace gate
        run: git diff --check

      - name: GitHub Actions lint
        uses: raven-actions/actionlint@v2

  docker_validation:
    name: Optional Docker validation
    needs: repository_quality
    if: always() && needs.repository_quality.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Detect Dockerfile
        id: docker
        run: |
          if [ -f Dockerfile ]; then echo "available=true" >> "$GITHUB_OUTPUT"; else echo "available=false" >> "$GITHUB_OUTPUT"; fi
      - name: Build container without publishing
        if: steps.docker.outputs.available == 'true'
        run: docker build --file Dockerfile --tag quantum-nexus-ci:${{ github.sha }} .
      - name: No Dockerfile
        if: steps.docker.outputs.available != 'true'
        run: echo "No Dockerfile is defined; container validation is not applicable."

  tagged_release:
    name: Optional tagged release
    needs: repository_quality
    if: startsWith(github.ref, 'refs/tags/v') && needs.repository_quality.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Detect release configuration
        id: release_config
        run: |
          if [ -f .releaserc ] || [ -f .releaserc.json ] || [ -f .releaserc.yml ] || [ -f .releaserc.yaml ] || [ -f release.config.js ] || [ -f release.config.cjs ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup Node.js
        if: steps.release_config.outputs.available == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install release tooling
        if: steps.release_config.outputs.available == 'true'
        run: npm install --no-save semantic-release @semantic-release/github
      - name: Publish release
        if: steps.release_config.outputs.available == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
      - name: No release configuration
        if: steps.release_config.outputs.available != 'true'
        run: echo "No semantic-release configuration is defined; tagged release publication is skipped."
