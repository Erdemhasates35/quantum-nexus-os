name: Quantum Nexus Static Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quantum-static-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify static/build artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
          package-manager-cache: false
      - name: Install dependencies
        if: hashFiles('package.json') != ''
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Build application
        if: hashFiles('package.json') != ''
        run: npm run build
      - name: Validate existing static output
        run: |
          if [ -d out ]; then
            test -f out/index.html
            echo "Static export verified: out/index.html"
          else
            echo "No static export directory configured; Vercel/Next production build is the deployment target."
          fi
      - name: Workflow lint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7
