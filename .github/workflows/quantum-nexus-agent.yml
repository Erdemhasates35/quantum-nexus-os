name: Quantum Nexus Autonomous Verification

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quantum-agent-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Read-only autonomous verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install Node dependencies when declared
        run: |
          if [ -f package.json ]; then
            if [ -f package-lock.json ]; then npm ci; else npm install; fi
          fi

      - name: Python syntax verification
        run: |
          python - <<'PY'
          import pathlib, py_compile
          failures=[]
          files=[p for p in pathlib.Path('.').rglob('*.py') if '.git' not in p.parts and 'node_modules' not in p.parts]
          for p in files:
              try: py_compile.compile(str(p), doraise=True)
              except Exception as exc: failures.append((str(p), str(exc)))
          if failures:
              for path, error in failures: print(f"PY_COMPILE_FAIL {path}: {error}")
              raise SystemExit(1)
          print(f"Python syntax OK: {len(files)} files")
          PY

      - name: Node production build when available
        if: hashFiles('package.json') != ''
        run: npm run build

      - name: GitHub Actions workflow lint
        uses: raven-actions/actionlint@v2

      - name: Repository integrity report
        run: |
          git diff --check
          git status --short
          echo "Quantum Nexus verification completed without modifying repository files."
