name: v16 agent registry validation

on:
  pull_request:
    paths:
      - "config/agent-registry.v16.json"
      - "scripts/validate-agent-registry.mjs"
      - ".github/workflows/v16-agent-registry.yml"
  push:
    branches:
      - "nexus/v16-swarm-foundation-20261106"
    paths:
      - "config/agent-registry.v16.json"
      - "scripts/validate-agent-registry.mjs"
      - ".github/workflows/v16-agent-registry.yml"

permissions:
  contents: read

jobs:
  validate-agent-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate agent registry
        run: node scripts/validate-agent-registry.mjs
