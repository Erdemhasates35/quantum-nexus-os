name: Research Platform Tests
on:
  push:
    branches:
      - "research/**"
  pull_request:
    paths:
      - "research/technology-platform/**"
      - ".github/workflows/research-platform-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        env:
          PYTHONPATH: research/technology-platform/src
        run: |
          python -m unittest discover \
            -s research/technology-platform/tests \
            -p 'test_*.py' \
            -v
