name: Quantum Nexus Dependency Governance

on:
  push:
    branches: [main]
    paths:
      - '.github/dependabot.yml'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/dependabot.yml'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate dependency governance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install YAML validator
        run: python -m pip install pyyaml
      - name: Validate Dependabot YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          path = Path('.github/dependabot.yml')
          data = yaml.safe_load(path.read_text(encoding='utf-8'))
          assert data.get('version') == 2
          assert isinstance(data.get('updates'), list) and data['updates']
          for item in data['updates']:
              assert item['package-ecosystem'] in {'github-actions', 'npm', 'pip', 'cargo'}
              assert item['directory'].startswith('/')
              assert 'schedule' in item
          print('Dependabot configuration valid.')
          PY
      - name: Validate GitHub Actions
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7
      - name: Validate workflow YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in Path('.github/workflows').glob('*.yml'):
              yaml.safe_load(path.read_text(encoding='utf-8'))
              print(f'YAML OK: {path}')
          PY
