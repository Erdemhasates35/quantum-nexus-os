<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>QUANTUM NEXUS OS v30 — SOVEREIGN ARCHITECT</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--c:#00e5ff;--vi:#d500f9;--gr:#00e676;--re:#ff3d3d;--am:#ffb300;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;color:#a0c0d8;font-family:'Share Tech Mono',monospace;font-size:12px;overflow:hidden;}
.card{background:#0a1420;border:1px solid #163248;border-radius:4px;}
.ct{color:var(--c);font-family:Orbitron,sans-serif;font-weight:900;letter-spacing:3px;}
.scan-bar{height:3px;background:linear-gradient(90deg,transparent,var(--c),transparent);animation:scan 3s linear infinite;}
@keyframes scan{0%{transform:translateX(-150%)}100%{transform:translateX(400%)}}
.heatmap{position:relative;overflow:hidden;height:380px;background:#000;}
.particle{position:absolute;width:3px;height:3px;background:var(--vi);border-radius:50%;box-shadow:0 0 15px var(--vi);}
</style>
</head>
<body>

<div id="boot"><div style="padding:16px;color:var(--am)">Runtime status is loaded from the authenticated CSI backend.</div></div>

<div id="os">
  <div id="pgs">

    <!-- L2 CSI — DERİN TARAMA -->
    <div class="pg on" id="p1">
      <div class="ct">📡 NEXMON CSI + MULTI-LAYER DEEP SCAN v30</div>
      <div class="row">
        <div class="col">
          <div class="card">
            <div class="ch">NEXMON CSI HEATMAP · LIVE BACKEND ONLY</div>
            <div class="heatmap" id="heatmap"></div>
            <div class="scan-bar"></div>
          </div>
        </div>
        <div class="col">
          <div class="card">
            <div class="ch">CSI CAPTURE STATUS · VERIFIED DEVICE RECORDS</div>
            <div id="deviceLog" class="term" style="height:340px;overflow-y:auto"></div>
          </div>
        </div>
      </div>
      <button class="btn bc" onclick="deepMultiScan()">🔍 AUTHORIZED NEXMON CSI CAPTURE</button>
    </div>

    <!-- L30 SOVEREIGN (Epik) -->
    <div class="pg" id="p29">
      <div class="ct" style="font-size:2.4em;text-align:center;margin:30px">👑 SOVEREIGN ARCHITECT v30</div>
      <div id="sovlog" class="term" style="height:420px"></div>
    </div>

  </div>
</div>

<script>
const wsLog=document.getElementById("deviceLog");
function addLog(message,color="var(--gr)"){
  const row=document.createElement("div");row.style.color=color;row.textContent="["+new Date().toLocaleTimeString()+"] "+message;
  wsLog.appendChild(row);wsLog.scrollTop=wsLog.scrollHeight;
}
function renderHeatmap(samples){
  const container=document.getElementById("heatmap");container.replaceChildren();
  if(!Array.isArray(samples)||samples.length===0){
    const state=document.createElement("div");state.textContent="NEXMON CSI BACKEND NOT CONNECTED";
    state.style.cssText="padding:24px;color:var(--am);text-align:center";container.append(state);return;
  }
  samples.forEach((sample,index)=>{
    const value=Number(sample.amplitude??sample.value);
    if(!Number.isFinite(value))return;
    const cell=document.createElement("div");cell.className="particle";
    cell.style.left=(Number(sample.x??(index%12)/12*100))+"%";
    cell.style.top=(Number(sample.y??Math.floor(index/12)/Math.ceil(samples.length/12)*100))+"%";
    cell.style.opacity=String(Math.max(0,Math.min(1,value)));
    container.append(cell);
  });
}
async function bootSequence(){
  try{
    const response=await fetch("/api/csi/status",{cache:"no-store"});const data=await response.json();
    if(!response.ok)throw new Error(data.reason||"CSI service unavailable");
    addLog("Nexmon CSI connected · channel "+String(data.channel??"unreported"),"var(--gr)");
    renderHeatmap(data.heatmap);
  }catch(error){addLog("CSI unavailable: "+error.message,"var(--am)");renderHeatmap([]);}
}
async function deepMultiScan(){
  addLog("Authorized CSI scan requested…","var(--c)");
  try{
    const response=await fetch("/api/csi/scan",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"});
    const data=await response.json();
    if(!response.ok)throw new Error(data.reason||"CSI scan unavailable");
    addLog("Scan job accepted: "+data.scanId+" · "+data.status,"var(--gr)");
    addLog("Verified device records: "+data.devices.length,"var(--c)");
    for(const device of data.devices)addLog(JSON.stringify(device),"var(--gr)");
    renderHeatmap(data.heatmap);
  }catch(error){addLog("No scan performed: "+error.message,"var(--am)");}
}
window.addEventListener("load",bootSequence);
</script>
</body>
</html>
