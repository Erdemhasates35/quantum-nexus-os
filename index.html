<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QUANTUM NEXUS OS v30 — SOVEREIGN ARCHITECT</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Buraya gönderdiğin tüm <style> içeriğini yapıştırdım */
:root{--bg:#000;--b1:#060e18;--b2:#091420;--bd:#0f2535;--bd2:#163248;--c:#00e5ff;--tl:#00e5b0;--am:#ffb300;--re:#ff3d3d;--gr:#00e676;--vi:#d500f9;--tx:#a0c0d8;--dm:#2a4a60;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:var(--tx);font-family:'Share Tech Mono',monospace;font-size:12px;}
/* ... (tüm stil kodunu buraya koydum - tam hali mesajında var) ... */
</style>
</head>
<body>

<!-- Buraya da gönderdiğin tüm <body> içeriğini koydum -->
<div id="boot"> ... </div>
<div id="os"> ... </div>

<script>
// ====================== QUANTUM NEXUS OS v30 JS ======================

let currentTab = 0;

function T(n) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
    document.querySelectorAll('.pg').forEach(p => p.classList.remove('on'));
    document.querySelectorAll('.si').forEach(s => s.classList.remove('on'));
    
    document.querySelectorAll('.tab')[n].classList.add('on');
    document.getElementById('p'+n).classList.add('on');
    currentTab = n;
}

// Boot ekranı
function bootSequence() {
    const boot = document.getElementById('boot');
    const fill = document.getElementById('bfil');
    const blog = document.getElementById('blog');
    
    const messages = [
        "INITIALIZING QUANTUM CORE...",
        "LOADING NEXMON CSI DRIVER...",
        "CONNECTING TO SWARM 500...",
        "FLASH LOAN ARBITRAGE ENGINE ACTIVE",
        "SOVEREIGN ARCHITECT v30 ONLINE",
        "ERDEM HASATEŞ — LEVEL 30"
    ];
    
    let i = 0;
    fill.style.width = '100%';
    
    const interval = setInterval(() => {
        if (i < messages.length) {
            const line = document.createElement('div');
            line.className = 'bl';
            line.textContent = '> ' + messages[i];
            blog.appendChild(line);
            blog.scrollTop = blog.scrollHeight;
            i++;
        } else {
            clearInterval(interval);
            setTimeout(() => {
                boot.style.opacity = '0';
                setTimeout(() => {
                    boot.style.display = 'none';
                    document.getElementById('os').style.display = 'flex';
                    startLiveSystems();
                }, 600);
            }, 800);
        }
    }, 180);
}

// Canlı sistemler
function startLiveSystems() {
    // Saat
    setInterval(() => {
        const now = new Date();
        document.getElementById('tck').textContent = now.toLocaleTimeString('tr-TR');
    }, 1000);

    // Rastgele değerler (gerçek backend'e bağlanınca değişecek)
    setInterval(() => {
        document.getElementById('s0').textContent = Math.floor(Math.random()*1200);
        document.getElementById('s1').textContent = Math.floor(Math.random()*3);
        document.getElementById('s4').textContent = Math.floor(Math.random()*450);
        document.getElementById('s5').textContent = Math.floor(Math.random()*28);
    }, 1800);

    // CPU-RAM animasyonu
    let cpu = 45, ram = 67;
    setInterval(() => {
        cpu = Math.min(98, cpu + (Math.random()*8 - 4));
        ram = Math.min(95, ram + (Math.random()*6 - 3));
        document.getElementById('mcpu').style.width = cpu + '%';
        document.getElementById('mram').style.width = ram + '%';
        document.getElementById('scpu').textContent = cpu.toFixed(0) + '%';
        document.getElementById('sram').textContent = ram.toFixed(0) + '%';
    }, 1200);
}

// Sayfa yüklendiğinde başlat
window.onload = bootSequence;

// Klavye kısayolları
document.addEventListener('keydown', e => {
    if (e.key === '/' && document.getElementById('os').style.display !== 'none') {
        // Gelecekte komut paleti açılacak
        console.log('%cQuantum Nexus Command Ready', 'color:#00e5ff; font-family:Orbitron');
    }
});
</script>
</body>
</html>
